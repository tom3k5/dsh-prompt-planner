# dsh-prompt-planner bundle patch: inserts the prompt-planner plugin row
# into the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field); install with
# `dsh plugin --profile web add link:<path>/dsh-prompt-planner`.
#
# Host-only package: the node half (exports ".") runs in the host process
# and registers the `prompt_plan` model-facing tool (harness.registerTool).
# There is no browser half.
- insert:
    - id: prompt-planner
      name: dsh-prompt-planner
